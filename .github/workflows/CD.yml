#      uses: appleboy/ssh-action@v0.1.8
#      with:
#        host: ${{ secrets.SSH_HOST }}
#        username: ${{ secrets.SSH_USER }}
#        key: ${{ secrets.SSH_PRIVATE_KEY }}
#        script: |
#          cd /home/${{ secrets.SSH_USER }}/FrontEnd
#          docker logout ghcr.io
#          docker login ghcr.io -u ${{ secrets.USERNAME }} -p ${{ secrets.PAT }}
#          docker compose pull
#          docker compose down --remove-orphans
#          docker compose up -d
#          docker image prune -f
- name: Deploy via SSH
  if: steps.docker_build.outcome == 'success'
  uses: appleboy/ssh-action@v0.1.8
  with:
    host: ${{ secrets.SSH_HOST }}
    username: ${{ secrets.SSH_USER }}
    key: ${{ secrets.SSH_PRIVATE_KEY }}
    script: |
      cd /home/${{ secrets.SSH_USER }}/FrontEnd
      docker logout ghcr.io
      docker login ghcr.io -u ${{ secrets.USERNAME }} -p ${{ secrets.PAT }}

      echo "🧼 Removing old frontend container (if it exists)..."
      docker rm -f frontend || true

      echo "📦 Pulling latest image..."
      docker compose pull

      echo "💥 Bringing down old containers..."
      docker compose down --remove-orphans

      echo "🚀 Spinning up fresh containers..."
      docker compose up -d

      echo "🧹 Cleaning up dangling images..."
      docker image prune -f
