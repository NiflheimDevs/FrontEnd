name: CD

on:
  push:
    branches:
      - SERVER_REPO
  pull_request:
    branches:
      - develop
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  pull-requests: write
  issues: write
  contents: read
  packages: write

jobs:
  cd:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ secrets.USERNAME }}
        password: ${{ secrets.PAT }}

    - name: Build Docker image
      id: docker_build
      continue-on-error: true
      run: |
        docker compose build | tee /tmp/output.txt
        export OUTPUT="$(cat /tmp/output.txt)"

    - name: Push Docker image
      if: success() && steps.docker_build.outcome == 'success'
      continue-on-error: true
      run: docker compose push

    - name: Handle Build Failure
      if: ${{ steps.docker_build.outcome == 'failure' && github.event_name == 'pull_request' }}
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          const { owner, repo, number } = context.issue;
          let errorMessage = `❌ Build failed!\n\nError:\n\`\`\`\n${fs.readFileSync('/tmp/output.txt', 'utf8')}\n\`\`\``;
          await github.rest.issues.createComment({ owner, repo, issue_number: number, body: errorMessage });
          await github.rest.pulls.update({ owner, repo, pull_number: number, state: 'closed' });

    - name: Copy docker-compose.yml to server
      if: steps.docker_build.outcome == 'success'
      uses: appleboy/scp-action@v0.1.0
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        source: "docker-compose.yml"
        target: "/home/${{ secrets.SSH_USER }}/FrontEnd"

#    - name: Deploy via SSH
